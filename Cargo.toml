[package]
edition = "2024"
name = "weather-station"
rust-version = "1.95"
version = "0.1.0"

[[bin]]
name = "weather-upd"
path = "./src/bin/main.rs"

[dependencies]

esp-hal = { version = "~1.2.2", features = ["defmt", "esp32", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }

defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32"] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
  "dns",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32"] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "defmt",
  "esp-alloc",
  "esp32",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
  "dns-max-server-count-4",
] }

critical-section = "1.2.0"
static_cell = "2.1.1"

# esp-wifi = { version = "0.13.0", features = [
#   "builtin-scheduler",
#   "defmt",
#   "esp-alloc",
#   "esp32",
#   "smoltcp",
#   "wifi",
# ] }
heapless = { version = "0.8.0", default-features = false, features = ["serde"] }
embedded-hal-bus = { version = "0.3" }
embedded-graphics = "0.8.1"
tinybmp = "0.7.0"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
chrono = { version = "0.4.40", default-features = false, features = ["serde"] }
serde-json-core = "0.7.0"
serde_repr = "0.1.20"
profont = "0.7.0"
reqwless = { default-features = false, features = [
  "mbedtls-rs",
  "log",
], git = "https://github.com/drogue-iot/reqwless", rev = "0d9f8d107e45d4fc62e6c6e40c69052e81cde07c" }
# mbedtls-rs = {version = "0.3.0", features = ["esp32"]}
# esp-mbedtls = { git = "https://github.com/esp-rs/esp-mbedtls.git",  features = ["esp32"] }
epd-waveshare = { features = [
  "graphics",
], git = "https://github.com/ImplFerris/epd-waveshare" }
mbedtls-rs = "0.1.0"


[patch.crates-io]
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal", rev = "6fedea34e224" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
